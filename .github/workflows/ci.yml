name: CI & Guardrails

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-main-source:
    name: Trava de Seguranca (Origem da Main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validar se a origem do PR e estritamente develop
        if: github.head_ref != 'develop'
        run: |
          echo "::error::❌ Bloqueio de Seguranca: Pull Requests para a branch 'main' sao restritos e so podem vir da branch 'develop'!"
          echo "Branch de origem tentada: '${{ github.head_ref }}'"
          echo "Por favor, altere o branch base do seu PR para 'develop'."
          exit 1

  verify:
    name: Lint, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 0 warnings)
        run: npm run lint

      - name: Typecheck (TypeScript compiler)
        run: npm run typecheck

      - name: Unit & Schema Regression Tests (Vitest)
        run: npm test

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests (Playwright Browser Headless)
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build

      - name: Upload Playwright test report (on failure or completion)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
