name: CI & Guardrails

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'feature/**', 'infra/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Lint, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 0 warnings)
        run: npm run lint

      - name: Typecheck (TypeScript compiler)
        run: npm run typecheck

      - name: Unit & Schema Regression Tests (Vitest)
        run: npm test

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests (Playwright Browser Headless)
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build

      - name: Upload Playwright test report (on failure or completion)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
