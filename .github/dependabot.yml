version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tiptap-ecosystem:
        patterns:
          - "@tiptap/*"
      typst-ecosystem:
        patterns:
          - "@myriaddreamin/*"
      tailwind-ecosystem:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Demais atualizações minor/patch num único PR semanal (majors seguem em PRs separados)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Aguardar typescript-eslint suportar TypeScript >= 7 (peerDependency atual < 6.1.0)
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  # Serviço de importação (Pandoc no Railway)
  - package-ecosystem: "npm"
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(server)"
    labels:
      - "dependencies"
      - "server"
      - "automated"
    groups:
      server-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(server)"
    labels:
      - "dependencies"
      - "server"
      - "automated"
    ignore:
      # Manter a linha LTS do Node (24); só aceitar patches/minors da imagem
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "automated"
