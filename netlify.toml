[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client https://apis.google.com https://www.gstatic.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://accounts.google.com https://*.gstatic.com https://drive.google.com; connect-src 'self' blob: data: https://www.googleapis.com https://*.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://apis.google.com https://*.gstatic.com https://packages.typst.org https://cdn.jsdelivr.net https://formsubmit.co https://*.peerjs.com wss://*.peerjs.com; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com https://docs.google.com https://drive.google.com; object-src 'none'; base-uri 'self';"

[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
