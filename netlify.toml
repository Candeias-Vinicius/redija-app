[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
